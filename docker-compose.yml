services:
  # Optional — default is local PostgreSQL socket.
  # Uncomment if you prefer containerized PG:
  # postgres:
  #   image: postgres:16
  #   environment:
  #     POSTGRES_USER: newsc
  #     POSTGRES_PASSWORD: newsc
  #     POSTGRES_DB: newsc
  #   ports:
  #     - "5433:5432"
  #   volumes:
  #     - newsc_pg:/var/lib/postgresql/data

  orchestrator:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    env_file: .env
    ports:
      - "8787:8787"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles: ["docker"]

volumes: {}
