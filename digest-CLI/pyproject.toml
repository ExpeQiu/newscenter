[project]
name = "newsc-digest-cli"
version = "0.1.0"
description = "Push HTML digests to NewsC via orchestrator HTTP"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1.0",
  "httpx>=0.28.0",
  "rich>=13.9.0",
]

[project.scripts]
newsc-digest = "digest_cli.cli:main"

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["digest_cli*"]
